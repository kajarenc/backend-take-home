[project]
name = "baseten-backend-take-home"
version = "1.0.0"
description = "Baseten backend take home python boilerplate"
authors = [
    {name = "Pierre-Alexandre St-Jean", email = "pa@baseten.co"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.0",
    "uvicorn[standard]==0.24.0",
    "strawberry-graphql[fastapi]==0.265.0",
    "aiohttp==3.9.0",
    "sqlalchemy==2.0.0",
    "aiosqlite==0.19.0",
    "httpx==0.25.0",
]

[project.optional-dependencies]
dev = [
    "black==23.12.0",
    "flake8==6.0.0",
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "managed"

[tool.hatch.build.targets.wheel]
packages = ["baseten_backend_take_home"]

[tool.black]
line-length = 79
