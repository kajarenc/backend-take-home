services:
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: "baseten_backend_take_home.main:app"
        PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mock-server:
        condition: service_healthy
    environment:
      - MOCK_SERVER_URL=http://mock-server:8001
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healtz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "service.name=main-app"
      - "service.type=api"

  mock-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: "baseten_backend_take_home.worklet_mock_server:app"
        PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/healtz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "service.name=mock-server"
      - "service.type=mock"

networks:
  app-network:
    driver: bridge
